# Astro 构建并部署到 GitHub Pages
name: Deploy to GitHub Pages

on:
  # 推送到默认分支时触发
  push:
    branches: ["master", "main"]

  # 允许从 Actions 面板手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write  # 允许清理旧 artifact

# 新部署取消旧部署，避免并发 artifact 冲突
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 自动将仓库 Pages Source 设为 GitHub Actions（如果尚未设置）
          enablement: true

      # 清理仓库中残留的旧 github-pages artifact
      # 防止 deploy-pages 因找到多个同名 artifact 而失败
      - name: Clean up old Pages artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'github-pages',
              per_page: 100,
            });
            let deleted = 0;
            for (const artifact of artifacts.data.artifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted old github-pages artifact #${artifact.id}`);
              deleted++;
            }
            if (deleted === 0) {
              core.info('No old github-pages artifacts to clean up.');
            } else {
              core.info(`Cleaned up ${deleted} old artifact(s).`);
            }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传 Astro 构建产物
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
