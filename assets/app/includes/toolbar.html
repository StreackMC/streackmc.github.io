<!-- 工具栏 — 由 framework.js 动态加载 -->
<div id="toolbar-area" class="glass">
  <!-- 展示按钮 -->
  <div id="toolbar1">
    <!-- 品牌logo -->
    <div onclick='window.streack.openURL("/",true)'><span class="WenQuanWeiMiHei">栈流</span><span class="MiSans"
        style="color:var(--s-color-primary);">Streack</span></div>
    <!-- 导航项插槽：页面可通过 <template data-toolbar-nav> 提供自定义项 -->
    <div id="toolbar-nav-slot">
      <div pc-only onclick='window.streack.openURL("/doc",true)' clickable>文档</div>
      <div pc-only onclick='window.streack.openURL("/webtool/status.html",true)' clickable>在线状态</div>
    </div>
    <!-- 搜索按钮 -->
    <s-tooltip clickable id="toolbar1-search">
      <svg slot="trigger" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
        <path style="fill:currentColor;"
          d="M14.298,27.202l-3.87-3.87c0.701-0.929,1.122-2.081,1.122-3.332c0-3.06-2.489-5.55-5.55-5.55c-3.06,0-5.55,2.49-5.55,5.55 c0,3.061,2.49,5.55,5.55,5.55c1.251,0,2.403-0.421,3.332-1.122l3.87,3.87c0.151,0.151,0.35,0.228,0.548,0.228 s0.396-0.076,0.548-0.228C14.601,27.995,14.601,27.505,14.298,27.202z M1.55,20c0-2.454,1.997-4.45,4.45-4.45 c2.454,0,4.45,1.997,4.45,4.45S8.454,24.45,6,24.45C3.546,24.45,1.55,22.454,1.55,20z"
          transform="translate(0, -9)" />
      </svg>
      搜索
    </s-tooltip>
  </div>
  <!-- 操作区域（data-toolbar-slot 声明式插槽） -->
  <div id="toolbar2">
    <div data-toolbar-slot="search" data-noscroll="true" class="toolbar2-slot" style="overflow: hidden;">
      <div id="toolbar-search-box">
        <svg id="toolbar-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
          <path
            d="M14.298,27.202l-3.87-3.87c0.701-0.929,1.122-2.081,1.122-3.332c0-3.06-2.489-5.55-5.55-5.55c-3.06,0-5.55,2.49-5.55,5.55 c0,3.061,2.49,5.55,5.55,5.55c1.251,0,2.403-0.421,3.332-1.122l3.87,3.87c0.151,0.151,0.35,0.228,0.548,0.228 s0.396-0.076,0.548-0.228C14.601,27.995,14.601,27.505,14.298,27.202z M1.55,20c0-2.454,1.997-4.45,4.45-4.45 c2.454,0,4.45,1.997,4.45,4.45S8.454,24.45,6,24.45C3.546,24.45,1.55,22.454,1.55,20z"
            transform="translate(0, -9)" />
        </svg>
        <input id="toolbar-search-input" type="text" placeholder="搜索 Streack……" spellcheck="false" autocomplete="off" />
      </div>
      <div id="toolbar-search-suggestions"></div>
    </div>
  </div>
</div>
<!-- 辅助区域，用于点击就关 -->
<div id="toolbar-outline"></div>
